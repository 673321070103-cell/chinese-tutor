- ประโยคภาษาจีนควรสั้น เป็นธรรมชาติ เหมาะกับผู้เริ่มต้น ใช้คำศัพท์พื้นฐาน
- ให้กำลังใจ เป็นกันเอง เหมือนครูที่อบอุ่น`;
      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = a[i];
          a[i] = a[j];
          a[j] = temp;
        }
        return a;
      }

      function normalizeHanzi(s) {
        return (s || '').replace(/[，。！？、\s,.!?]/g, '');
      }

      function SpeakButton({ text, size = 18, onSpeak }) {
        return (
          <button
            type="button"
            onClick={(e) => {
              e.preventDefault();

                onSpeak(text);

            style={{

              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>

      function ChineseSpeakingTutor() {
        const [tab, setTab] = useState('learn');
        const [voices, setVoices] = useState([]);

        // 1. โหลดรายการเสียง (Voices) มารอไว้ใน State
        useEffect(() => {
          if (!('speechSynthesis' in window)) return;

          const updateVoices = () => {
            const availableVoices = window.speechSynthesis.getVoices();
            if (availableVoices.length > 0) {
              setVoices(availableVoices);
            }
          };

          updateVoices();
          window.speechSynthesis.onvoiceschanged = updateVoices;

          return () => {
            window.speechSynthesis.onvoiceschanged = null;
          };
        }, []);

        // 2. ฟังก์ชัน speak ที่ดึงเสียงจาก State และรองรับการสั่งพูดซ้ำ
        const speak = useCallback((text, rate = 0.88) => {
          if (!('speechSynthesis' in window) || !text) return;

          // ยกเลิกคิวเสียงเก่า
          window.speechSynthesis.cancel();

          // สร้าง Utterance ใหม่
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'zh-CN';
          u.rate = rate;

          // ค้นหาเสียงภาษาจีน (zh-CN, zh-TW, zh-HK)
          const currentVoices = voices.length > 0 ? voices : window.speechSynthesis.getVoices();
          const zh = currentVoices.find((v) => 
            v.lang && (v.lang.toLowerCase().includes('zh') || v.lang.toLowerCase().includes('cn'))
          );

          if (zh) {
            u.voice = zh;
          }

          // แก้ปัญหา Chrome บล็อกเสียงถ้าไม่มี Interaction หรือสั่งพูดยาว
          setTimeout(() => {
            window.speechSynthesis.speak(u);
          }, 50);
        }, [voices]);

        return (
          <div style={{
            fontFamily: "'Noto Sans Thai','Noto Sans',sans-serif",
            background: COLORS.paper, color: COLORS.ink,
            minHeight: '100vh', width: '100%', boxSizing: 'border-box',
            padding: '20px 16px 40px',
          }}>
            <Header />
            <TabBar tab={tab} setTab={setTab} />

            <div style={{ maxWidth: 720, margin: '28px auto 0' }}>
              {tab === 'learn' && <LearnTab speak={speak} />}
              {tab === 'listen' && <ListenTab speak={speak} />}
              {tab === 'quiz' && <QuizTab speak={speak} />}
              {tab === 'chat' && <ChatTab speak={speak} />}
            </div>
          </div>
        );
      }

      function ListenTab({ speak }) {
        const [cat, setCat] = useState('greeting');
        const items = VOCAB.filter((v) => v.category === cat);
        const [idx, setIdx] = useState(0);
        const [micState, setMicState] = useState('idle');
        const [transcript, setTranscript] = useState('');
        const recRef = useRef(null);
        const current = items[idx] || items[0];

        useEffect(() => { setIdx(0); setMicState('idle'); setTranscript(''); }, [cat]);

        function startListening() {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SR) { 
            setMicState('unsupported'); 
            return; 
          }

          // หากมีการอัดเสียงค้างอยู่ ให้สั่งหยุดก่อนเปิดใหม่
          if (recRef.current) {
            try { recRef.current.abort(); } catch (e) {}
          }

          try {
            const rec = new SR();
            rec.lang = 'zh-CN';
            rec.interimResults = false;
            rec.maxAlternatives = 3;
            recRef.current = rec;

            setTranscript('');
            
            rec.onstart = () => {
              setMicState('listening');
            };

            rec.onresult = (e) => {
              if (!e.results || !e.results[0]) return;
              
              const alts = Array.from(e.results[0]).map((r) => r.transcript);
              const spokenText = alts[0] || '';
              setTranscript(spokenText);

              // ตรวจสอบความถูกต้องของคำศัพท์
              const target = normalizeHanzi(current.hanzi);
              const hit = alts.some((a) => {
                const norm = normalizeHanzi(a);
                return norm.includes(target) || target.includes(norm);
              });

              setMicState(hit ? 'correct' : 'wrong');
            };

            rec.onerror = (e) => {
              console.error('Speech recognition error:', e.error);
              
              if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                setMicState('denied');
                alert(
                  'ระบบถูกจำกัดการเข้าถึงไมโครโฟนจาก Google Apps Script Frame\n\n' +
                  'วิธีแก้ไข:\n' +
                  '1. หากเปิดในหน้าแก้ไข ให้ใช้ลิงก์ Web App (URL ที่ลงท้ายด้วย /exec)\n' +
                  '2. ตรวจสอบว่าไม่ได้เปิดในโหมดไม่ระบุตัวตน (Incognito Mode)'
                );
              } else {
                setMicState('wrong');
              }
            };

            rec.onend = () => {
              // คืนค่าเป็น idle เฉพาะเมื่อยังฟังไม่เสร็จหรือไม่ได้ผลลัพธ์
              setMicState((p) => (p === 'listening' ? 'idle' : p));
            };

            rec.start();
          } catch (err) {
            console.error('Mic start error:', err);
            setMicState('unsupported');
          }
        }

        function stopListening() {
          if (recRef.current) recRef.current.stop();
        }

        function next(delta) {
          setMicState('idle'); setTranscript('');
          setIdx((i) => (i + delta + items.length) % items.length);
        }

        if (!current) return null;

        const feedback = {
          idle: { text: 'กดปุ่มไมค์แล้วลองพูดตามคำนี้ดูนะ', color: COLORS.inkSoft },
          listening: { text: 'กำลังฟัง... พูดได้เลย', color: COLORS.gold },
          correct: { text: 'เยี่ยมมาก! ออกเสียงถูกต้อง 👏', color: COLORS.bamboo },
          wrong: { text: `ยังไม่ตรงนัก ลองอีกครั้งนะ (ได้ยินว่า: ${transcript || '...'})`, color: COLORS.seal },
          denied: { text: 'ไม่สามารถเข้าถึงไมโครโฟนได้ ลองฟังแล้วฝึกพูดตามด้วยตัวเองแทนนะ', color: COLORS.seal },
          unsupported: { text: 'เบราว์เซอร์นี้ไม่รองรับการฟังเสียงพูด ลองฟังแล้วฝึกพูดตามด้วยตัวเองแทนนะ', color: COLORS.seal },
        }[micState];

        return (
          <div>
            <CategoryChips value={cat} onChange={setCat} />
            <div style={{
              marginTop: 18, border: `1px solid ${COLORS.line}`, borderRadius: 10,
              background: COLORS.paperDark, padding: '32px 20px', textAlign: 'center',
            }}>
              <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 6 }}>
                คำที่ {idx + 1} / {items.length}
              </div>
              <div className="csp-hanzi" style={{ fontSize: 48, fontWeight: 700 }}>{current.hanzi}</div>
              <div style={{ fontSize: 16, color: COLORS.gold, fontStyle: 'italic', marginTop: 4 }}>{current.pinyin}</div>
              <div style={{ fontSize: 15, marginTop: 4 }}>{current.thai}</div>

              <div style={{ display: 'flex', justifyContent: 'center', gap: 14, marginTop: 22 }}>
                <button type="button" onClick={() => speak(current.hanzi)} style={{
                  display: 'flex', alignItems: 'center', gap: 8, padding: '10px 18px',
                  borderRadius: 999, border: `1px solid ${COLORS.line}`, background: COLORS.paper,
                  color: COLORS.ink, fontWeight: 600, fontSize: 14, cursor: 'pointer',
                  }}>
                    <span style={{ fontSize: 16 }}>🔊</span> ฟัง
                </button>
                <button
                  type="button"
                  onClick={micState === 'listening' ? stopListening : startListening}
                  style={{
                    display: 'flex', alignItems: 'center', gap: 8, padding: '10px 18px',
                    borderRadius: 999, border: 'none',
                    background: micState === 'listening' ? COLORS.seal : COLORS.bamboo,
                    color: '#fff', fontWeight: 600, fontSize: 14, cursor: 'pointer',
                  }}
                >
                  {micState === 'listening' ? <Square size={16} /> : <Mic size={16} />}
                  {micState === 'listening' ? 'หยุด' : 'พูดตาม'}
                </button>
              </div>

              <div style={{ marginTop: 16, fontSize: 13.5, color: feedback.color, minHeight: 20 }}>
                {feedback.text}
              </div>
            </div>

            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 14 }}>
              <button type="button" onClick={() => next(-1)} style={navBtnStyle}>
                <ChevronLeft size={16} /> ก่อนหน้า
              </button>
              <button type="button" onClick={() => next(1)} style={navBtnStyle}>
                ถัดไป <ChevronRight size={16} />
              </button>
            </div>
          </div>
        );
      }

      const navBtnStyle = {
        display: 'flex', alignItems: 'center', gap: 6, padding: '8px 14px',
        borderRadius: 8, border: `1px solid ${COLORS.line}`, background: COLORS.paper,
        color: COLORS.ink, fontSize: 13.5, fontWeight: 600, cursor: 'pointer',
      };

      function buildQuiz(catKey) {
        const pool = VOCAB.filter((v) => v.category === catKey);
        const qCount = Math.min(8, pool.length);
        return shuffle(pool).slice(0, qCount).map((item) => {
          const direction = Math.random() < 0.5 ? 'toThai' : 'toHanzi';
          const distractors = shuffle(pool.filter((v) => v.id !== item.id)).slice(0, 3);
          const options = shuffle([item, ...distractors]);
          return { item, direction, options };
        });
      }

      function QuizTab({ speak }) {
        const [cat, setCat] = useState('greeting');
        const [questions, setQuestions] = useState(() => buildQuiz('greeting'));
        const [qi, setQi] = useState(0);
        const [score, setScore] = useState(0);
        const [selected, setSelected] = useState(null);
        const [done, setDone] = useState(false);

        function restart(newCat) {
          const c = newCat || cat;
          setCat(c);
          setQuestions(buildQuiz(c));
          setQi(0); setScore(0); setSelected(null); setDone(false);
        }

        const q = questions[qi];

        function choose(opt) {
          if (selected) return;
          setSelected(opt.id);
          if (opt.id === q.item.id) setScore((s) => s + 1);
        }

        function nextQuestion() {
          if (qi + 1 >= questions.length) { setDone(true); return; }
          setQi((i) => i + 1);
          setSelected(null);
        }

        if (done) {
          return (
            <div style={{
              border: `1px solid ${COLORS.line}`, borderRadius: 10, background: COLORS.paperDark,
              padding: '36px 20px', textAlign: 'center',
            }}>
              <Sparkles size={28} color={COLORS.gold} style={{ marginBottom: 8 }} />
              <div style={{ fontSize: 20, fontWeight: 700 }}>ทำเสร็จแล้ว!</div>
              <div style={{ fontSize: 15, color: COLORS.inkSoft, marginTop: 6 }}>
                คะแนนของคุณ: <b style={{ color: COLORS.ink }}>{score} / {questions.length}</b>
              </div>
              <button type="button" onClick={() => restart()} style={{
                marginTop: 20, display: 'inline-flex', alignItems: 'center', gap: 8,
                padding: '10px 20px', borderRadius: 999, border: 'none',
                background: COLORS.seal, color: '#fff', fontWeight: 600, fontSize: 14, cursor: 'pointer',
              }}>
                <RefreshCw size={16} /> ทำอีกครั้ง
              </button>
            </div>
          );
        }

        if (!q) return null;

        const promptHanzi = q.direction === 'toThai' ? q.item.hanzi : null;
        const promptPinyin = q.direction === 'toThai' ? q.item.pinyin : null;
        const promptThai = q.direction === 'toHanzi' ? q.item.thai : null;

        return (
          <div>
            <CategoryChips value={cat} onChange={(c) => restart(c)} />

            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', margin: '16px 0 10px' }}>
              <span style={{ fontSize: 13, color: COLORS.inkSoft }}>ข้อ {qi + 1} / {questions.length}</span>
              <span style={{ fontSize: 13, color: COLORS.inkSoft }}>คะแนน {score}</span>
            </div>

            <div style={{
              border: `1px solid ${COLORS.line}`, borderRadius: 10, background: COLORS.paperDark,
              padding: '28px 20px', textAlign: 'center',
            }}>
              <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 10 }}>
                {q.direction === 'toThai' ? 'คำนี้แปลว่าอะไร?' : 'คำนี้เขียนแบบใด?'}
              </div>
              {q.direction === 'toThai' ? (
                <>
                  <div className="csp-hanzi" style={{ fontSize: 40, fontWeight: 700 }}>{promptHanzi}</div>
                  <div style={{ fontSize: 15, color: COLORS.gold, fontStyle: 'italic', marginTop: 4 }}>{promptPinyin}</div>
                  <div style={{ marginTop: 10 }}>
                    <SpeakButton text={promptHanzi} size={16} onSpeak={speak} />
                  </div>
                </>
              ) : (
                <div style={{ fontSize: 22, fontWeight: 700 }}>{promptThai}</div>
              )}
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginTop: 14 }}>
              {q.options.map((opt) => {
                const isCorrect = opt.id === q.item.id;
                const isChosen = selected === opt.id;
                let bg = COLORS.paper, border = COLORS.line, color = COLORS.ink;
                if (selected) {
                  if (isCorrect) { bg = COLORS.bambooSoft; border = COLORS.bamboo; }
                  else if (isChosen) { bg = COLORS.sealSoft; border = COLORS.seal; }
                }
                return (
                  <button
                    type="button"
                    key={opt.id}
                    className="csp-opt"
                    onClick={() => choose(opt)}
                    style={{
                      border: `1.5px solid ${border}`, background: bg, color,
                      borderRadius: 8, padding: '14px 10px', fontSize: 15,
                      cursor: selected ? 'default' : 'pointer', display: 'flex',
                      flexDirection: 'column', alignItems: 'center', gap: 3,
                      animation: selected && (isCorrect || isChosen) ? 'csp-pop 150ms ease' : 'none',
                    }}
                  >
                    {q.direction === 'toThai' ? (
                      <span>{opt.thai}</span>
                    ) : (
                      <>
                        <span className="csp-hanzi" style={{ fontSize: 22, fontWeight: 700 }}>{opt.hanzi}</span>
                        <span style={{ fontSize: 12, color: COLORS.gold, fontStyle: 'italic' }}>{opt.pinyin}</span>
                      </>
                    )}
                    {selected && isCorrect && <Check size={14} color={COLORS.bamboo} />}
                    {selected && isChosen && !isCorrect && <X size={14} color={COLORS.seal} />}
                  </button>
                );
              })}
            </div>

            {selected && (
              <button type="button" onClick={nextQuestion} style={{
                marginTop: 16, width: '100%', padding: '12px', borderRadius: 8, border: 'none',
                background: COLORS.ink, color: COLORS.paper, fontWeight: 600, fontSize: 14.5, cursor: 'pointer',
              }}>
                {qi + 1 >= questions.length ? 'ดูผลคะแนน' : 'ข้อถัดไป'}
              </button>
            )}
          </div>
        );
      }

      const STARTERS = ['你好！我叫...', 'ขอบคุณมากค่ะ', 'ฉันหิวข้าว', '多少钱？'];

      function ChatTab({ speak }) {
        const [messages, setMessages] = useState([
          { role: 'assistant', hanzi: '你好！我是林老师，很高兴认识你。', pinyin: 'nǐ hǎo! wǒ shì lín lǎoshī, hěn gāoxìng rènshi nǐ.', thai: 'สวัสดี! ฉันคือครูหลิน ยินดีที่ได้รู้จักนะ', note: '' },
        ]);
        const [input, setInput] = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const scrollRef = useRef(null);

        useEffect(() => {
          if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }, [messages, loading]);

        function sendMessage(text) {
          const trimmed = (text ?? input).trim();
          if (!trimmed || loading) return;
          const userMsg = { role: 'user', text: trimmed };
          const updated = [...messages, userMsg];
          setMessages(updated);
          setInput('');
          setLoading(true);
          setError('');

          const apiMessages = updated.map((m) =>
            m.role === 'user'
              ? { role: 'user', content: m.text }
              : { role: 'assistant', content: JSON.stringify({ hanzi: m.hanzi, pinyin: m.pinyin, thai: m.thai, note: m.note }) }
          );

          const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwdrCub6AEiFtlhEOseZ1Xg0GOQlJIgIXGzAutU7qlA-uXTnLQaiGSYFgigz6LG4rMZ/exec';

          fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ messages: apiMessages, systemPrompt: SYSTEM_PROMPT }),
          })
            .then((res) => res.json())
            .then((res) => {
              setLoading(false);
              if (res && res.success) {
                try {
                  let raw = res.text.replace(/```json|```/g, '').trim();
                  const parsed = JSON.parse(raw);
                  setMessages((prev) => [...prev, {
                    role: 'assistant',
                    hanzi: parsed.hanzi || '',
                    pinyin: parsed.pinyin || '',
                    thai: parsed.thai || '',
                    note: parsed.note || '',
                  }]);
                } catch (e) {
                  setError('รูปแบบการตอบกลับจาก AI ไม่ถูกต้อง');
                }
              } else {
                setError((res && res.error) || 'เกิดข้อผิดพลาดในการเชื่อมต่อ');
              }
            })
            .catch((err) => {
              setLoading(false);
              setError('เกิดข้อผิดพลาดจากเซิร์ฟเวอร์: ' + err.message);
            });
        }

        return (
          <div>
            <div ref={scrollRef} style={{
              border: `1px solid ${COLORS.line}`, borderRadius: 10, background: COLORS.paperDark,
              padding: 16, height: 420, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 12,
            }} className="csp-scroll">
              {messages.map((m, i) => (
                <div key={i} style={{ display: 'flex', justifyContent: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
                  {m.role === 'user' ? (
                    <div style={{
                      maxWidth: '78%', background: COLORS.ink, color: COLORS.paper,
                      borderRadius: '12px 12px 2px 12px', padding: '10px 14px', fontSize: 14.5,
                    }}>
                      {m.text}
                    </div>
                  ) : (
                    <div style={{
                      maxWidth: '82%', background: COLORS.paper, border: `1px solid ${COLORS.line}`,
                      borderRadius: '12px 12px 12px 2px', padding: '12px 14px',
                    }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <span className="csp-hanzi" style={{ fontSize: 18, fontWeight: 700 }}>{m.hanzi}</span>
                        <SpeakButton text={m.hanzi} size={13} onSpeak={speak} />
                      </div>
                      {m.pinyin && <div style={{ fontSize: 12.5, color: COLORS.gold, fontStyle: 'italic', marginTop: 3 }}>{m.pinyin}</div>}
                      {m.thai && <div style={{ fontSize: 13.5, marginTop: 4 }}>{m.thai}</div>}
                      {m.note && (
                        <div style={{
                          marginTop: 8, fontSize: 12.5, color: COLORS.seal, background: COLORS.sealSoft,
                          borderRadius: 6, padding: '6px 9px',
                        }}>
                          💡 {m.note}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              ))}
              {loading && (
                <div style={{ fontSize: 13, color: COLORS.inkSoft }}>ครูหลินกำลังพิมพ์...</div>
              )}
              {error && (
                <div style={{ fontSize: 13, color: COLORS.seal }}>{error}</div>
              )}
            </div>

            {messages.length <= 1 && (
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 10 }}>
                {STARTERS.map((s) => (
                  <button type="button" key={s} onClick={() => sendMessage(s)} style={{
                    fontSize: 12.5, padding: '6px 12px', borderRadius: 999,
                    border: `1px solid ${COLORS.line}`, background: COLORS.paper,
                    color: COLORS.ink, cursor: 'pointer',
                  }}>
                    {s}
                  </button>
                ))}
              </div>
            )}

            <form 
              onSubmit={(e) => { e.preventDefault(); sendMessage(); }}
              style={{ display: 'flex', gap: 8, marginTop: 12 }}
            >
              <input
                type="text"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                placeholder="พิมพ์ข้อความภาษาไทย หรือ ภาษาจีน..."
                style={{
                  flex: 1, padding: '10px 14px', borderRadius: 8,
                  border: `1px solid ${COLORS.line}`, background: COLORS.paperDark,
                  fontSize: 14, outline: 'none', color: COLORS.ink,
                }}
              />
              <button
                type="submit"
                disabled={loading}
                style={{
                  padding: '10px 18px', borderRadius: 8, border: 'none',
                  background: COLORS.seal, color: '#fff', fontWeight: 600,
                  fontSize: 14, cursor: loading ? 'not-allowed' : 'pointer',
                  display: 'flex', alignItems: 'center', gap: 6, opacity: loading ? 0.7 : 1,
                }}
              >
                <Send size={16} /> ส่ง
              </button>
            </form>
          </div>
        );
      }

      // Render App
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<ChineseSpeakingTutor />);
    </script>
  </body>
</html>
